name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
      - "integrate/*"
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: sparechange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sparechange"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Check Formatting with Black
        run: |
          black --check backend/

      - name: Run Mypy Type Checking
        run: |
          mypy backend/app

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          PYTHONPATH=backend pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Verify migrations build a working PostgreSQL schema
        env:
          DATABASE_URL: "postgresql://postgres:password123@localhost:5432/sparechange"
        run: |
          cd backend
          python scripts/migrate.py
          python - <<'PY'
          # The migrated schema must match the ORM models (no missing tables/columns).
          from sqlalchemy import inspect
          from app.database import Base, engine
          import app.models.models  # noqa: F401
          insp = inspect(engine)
          missing = [
              f"{t.name}.{c.name}"
              for t in Base.metadata.sorted_tables
              for c in t.columns
              if c.name not in {col["name"] for col in insp.get_columns(t.name)}
          ]
          assert not missing, f"columns missing after migrations: {missing}"
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: pennypilot-backend:ci

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.11.0"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: TypeScript Type Check
        working-directory: ./frontend
        run: |
          npm run ts:check

      - name: Frontend Unit Tests
        working-directory: ./frontend
        run: |
          npm test -- --ci
